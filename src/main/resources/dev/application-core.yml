spring:
#  servlet:
#    multipart:
#      max-file-size: 100000MB
#      max-request-size: 100000MB
  application:
    name: auth-service

  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/reactive_base} # r2dbc:postgresql://localhost:5432/reactive_base
    username: ${SPRING_R2DBC_USERNAME:postgres} # postgres
    password: ${SPRING_R2DBC_PASSWORD:admin} # admin
    pool:
      enabled: ${SPRING_R2DBC_POOL_ENABLED:true}
      max-size: ${SPRING_R2DBC_POOL_MAX_SIZE:10}
      initial-size: ${SPRING_R2DBC_POOL_INITIAL_SIZE:5}
      max-idle-time: ${SPRING_R2DBC_POOL_MAX_IDLE_TIME:30000}
    # properties:
    #   sslMode: REQUIRE
  sql:
    init:
      mode: never # always       # всегда выполнять schema.sql при старте
      schema-locations: classpath:schema.sql

  logging:
    level:
      reactor.netty.http.client: DEBUG
      reactor.netty.http.server.HttpServer: WARN
      reactor.netty.channel.ChannelOperationsHandler: WARN
      org:
        springframework:
          web:
            reactive:
              function:
                server:
                  AbstractErrorWebExceptionHandler: WARN
                client:
                  ExchangeFunctions: TRACE

jwt:
  access-secret: ${JWT_ACCESS_SECRET:yGWtgL2lfOp8rzSyRhNmSbC290iR3ifUT/30ATxS+jY=} # yGWtgL2lfOp8rzSyRhNmSbC290iR3ifUT/30ATxS+jY=
  refresh-secret: ${JWT_REFRESH_SECRET:TK5owe3GYyGht4yx/mGAsRi9sirI7738HD+LrduFpDo=} # TK5owe3GYyGht4yx/mGAsRi9sirI7738HD+LrduFpDo=

---
# Профиль dev
spring:
  config:
    activate:
      on-profile: dev
  r2dbc:
    url: r2dbc:postgresql://host.docker.internal:5432/reactive_base
  sql:
    init:
      mode: never
---
# Профиль prod
spring:
  config:
    activate:
      on-profile: prod
  r2dbc:
    url: r2dbc:postgresql://prod-db.mycompany.com:5432/reactive_base
    username: ${SPRING_R2DBC_USERNAME:prod_user}
    password: ${SPRING_R2DBC_PASSWORD:prod_pass}
  sql:
    init:
      mode: always